name: Frontend build and PHP checks

on:
  push:
    branches: [main, fix/frontend-bootstrap-clean-build]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: dvtec_testing
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: testing
      APP_TESTING_HTTP: 'false'
      APP_URL: http://127.0.0.1:8000
      APP_KEY: base64:BTWIi6nuqFGlT81VxZmmap2bkut6MZp2/6ZZddnBAbU=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: dvtec_testing
      DB_USERNAME: root
      DB_PASSWORD: ''
      CACHE_STORE: array
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      CURATOR_GLIDE_TOKEN: dvtec-test-glide-token
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: gd, imagick, mbstring, pdo_mysql, pdo_sqlite
          coverage: none
          tools: composer:v2
      - name: Install locked dependencies
        run: |
          npm install --global pnpm@10.15.0
          pnpm install --frozen-lockfile
          composer install --prefer-dist --no-interaction --no-progress
          cp .env.example .env
          mkdir -p test-results
          git rev-parse HEAD > test-results/tested-commit.txt
      - name: Audit PHP dependencies and code style
        run: |
          composer audit --no-interaction
          vendor/bin/pint --test
      - name: Build production assets
        run: pnpm build 2>&1 | tee test-results/build.log
      - name: Create isolated test schema and compile Blade
        run: |
          php artisan migrate --force
          php artisan view:cache
          php artisan view:clear
      - name: Run PHP unit and feature suite
        id: phpunit
        continue-on-error: true
        env:
          APP_TESTING_HTTP: 'true'
        run: vendor/bin/phpunit --log-junit test-results/phpunit.xml 2>&1 | tee test-results/phpunit.log
      - name: Require successful PHP suite
        if: always()
        env:
          PHPUNIT: ${{ steps.phpunit.outcome }}
        run: test "$PHPUNIT" = success
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: frontend-verification
          path: test-results/
          retention-days: 7
          if-no-files-found: warn

